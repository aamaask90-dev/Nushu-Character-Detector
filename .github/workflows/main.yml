name: Force Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Remove Google Services Plugin to Prevent Failure
      run: |
        echo "Removing google-services plugin application block..."
        find . -name "build.gradle*" -exec sed -i '/google-services/d' {} \;
        find . -name "build.gradle*" -exec sed -i '/com.google.gms.google-services/d' {} \;
        rm -f app/google-services.json

    - name: Force Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug -x validateSigningDebug --no-daemon
        else
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug -x validateSigningDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nushu-detector-apk
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
